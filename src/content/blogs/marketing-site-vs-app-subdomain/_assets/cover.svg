<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5502f"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1376" height="768" fill="url(#canvas)"/>
  <rect width="1376" height="768" fill="url(#grid)"/>

  <!-- title block -->
  <text x="64" y="96" fill="#d97757" font-size="22" font-weight="700" letter-spacing="6">DUAL-DOMAIN ARCHITECTURE</text>
  <text x="64" y="152" fill="#ededed" font-size="52" font-weight="700" letter-spacing="-1">Marketing site vs. app subdomain</text>
  <text x="64" y="186" fill="#a1a1a1" font-size="20">First-packet SEO, cross-subdomain sessions, Open Graph for crawlers that never run JS.</text>

  <!-- left panel: marketing -->
  <g>
    <rect x="64" y="228" width="580" height="300" rx="14" fill="#141414" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="64" y="228" width="580" height="52" rx="14" fill="#1c1c1c"/>
    <text x="88" y="262" fill="#ededed" font-size="24" font-weight="700">example.com</text>
    <text x="620" y="262" fill="#6fae8f" font-size="16" font-weight="600" text-anchor="end">SSR / SSG</text>

    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="88" y="306" width="420" height="10" rx="5"/>
      <rect x="88" y="330" width="500" height="10" rx="5"/>
      <rect x="88" y="354" width="340" height="10" rx="5"/>
      <rect x="88" y="378" width="470" height="10" rx="5"/>
      <rect x="88" y="402" width="260" height="10" rx="5"/>
    </g>

    <g font-size="15" fill="#a1a1a1">
      <text x="88" y="452">index, follow</text>
      <text x="88" y="478">JSON-LD + og:image 1200×630</text>
      <text x="88" y="504">public data only</text>
    </g>
    <circle cx="576" cy="446" r="7" fill="#2f6f4f"/>
    <circle cx="576" cy="472" r="7" fill="#3b6ea5"/>
    <circle cx="576" cy="498" r="7" fill="#b45309"/>
  </g>

  <!-- right panel: app -->
  <g>
    <rect x="732" y="228" width="580" height="300" rx="14" fill="#141414" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="732" y="228" width="580" height="52" rx="14" fill="#1c1c1c"/>
    <text x="756" y="262" fill="#ededed" font-size="24" font-weight="700">app.example.com</text>
    <text x="1288" y="262" fill="#7aa7d9" font-size="16" font-weight="600" text-anchor="end">SPA</text>

    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="756" y="306" width="200" height="72" rx="8"/>
      <rect x="972" y="306" width="200" height="72" rx="8"/>
      <rect x="756" y="394" width="416" height="40" rx="8"/>
    </g>
    <g font-size="14" fill="#a1a1a1">
      <text x="772" y="336">workspace</text>
      <text x="988" y="336">auth screens</text>
      <text x="772" y="420">order modal, filters, state preserved</text>
    </g>

    <g font-size="15" fill="#a1a1a1">
      <text x="756" y="474">noindex</text>
      <text x="756" y="500">__Host-session · HttpOnly · system fonts</text>
    </g>
    <circle cx="1244" cy="468" r="7" fill="#7e57c2"/>
    <circle cx="1244" cy="494" r="7" fill="#d97757"/>
  </g>

  <!-- bridge -->
  <path d="M644 378 C 680 330, 696 430, 732 378" fill="none" stroke="url(#terra)" stroke-width="3"/>
  <rect x="652" y="344" width="72" height="26" rx="13" fill="#0a0a0a" stroke="#d97757" stroke-opacity="0.5"/>
  <text x="688" y="362" fill="#d97757" font-size="14" font-weight="700" text-anchor="middle">301</text>
  <text x="688" y="392" fill="#a1a1a1" font-size="12" text-anchor="middle">edge</text>

  <!-- api bar -->
  <g>
    <rect x="64" y="560" width="1248" height="88" rx="14" fill="#141414" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="88" y="600" fill="#ededed" font-size="22" font-weight="700">api.example.com</text>
    <text x="88" y="628" fill="#a1a1a1" font-size="15">one backend, two boundary families</text>

    <rect x="420" y="580" width="420" height="48" rx="10" fill="#2f6f4f" fill-opacity="0.16" stroke="#2f6f4f" stroke-opacity="0.5"/>
    <text x="444" y="610" fill="#6fae8f" font-size="16" font-weight="600">/v1/public/*</text>
    <text x="816" y="610" fill="#6fae8f" font-size="14" text-anchor="end">cached · whitelisted</text>

    <rect x="872" y="580" width="416" height="48" rx="10" fill="#b45309" fill-opacity="0.16" stroke="#b45309" stroke-opacity="0.5"/>
    <text x="896" y="610" fill="#e0a458" font-size="16" font-weight="600">/v1/private/*</text>
    <text x="1264" y="610" fill="#e0a458" font-size="14" text-anchor="end">session · no-store</text>
  </g>

  <!-- footer rule -->
  <rect x="64" y="688" width="1248" height="1" fill="#ffffff" fill-opacity="0.09"/>
  <text x="64" y="726" fill="#a1a1a1" font-size="16">Route bridging · locale ladder · intent preservation · shared brand tokens</text>
  <text x="1312" y="726" fill="#d97757" font-size="16" font-weight="700" text-anchor="end">amr-tech</text>
</svg>
