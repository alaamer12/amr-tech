<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7aa7d9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b5502f"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Background -->
  <rect width="1280" height="720" fill="#0a0a0a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Subtle Outer Frame -->
  <rect x="32" y="32" width="1216" height="656" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Left: Floating Declaration Blocks -->
  <g transform="translate(140, 170)">
    <rect x="0" y="0" width="220" height="84" rx="10" fill="#141414" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="8" fill="#d97757"/>
    <rect x="52" y="30" width="120" height="8" rx="4" fill="#ededed" opacity="0.85"/>
    <rect x="52" y="48" width="84" height="6" rx="3" fill="#a1a1a1" opacity="0.5"/>

    <rect x="24" y="130" width="220" height="84" rx="10" fill="#141414" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="52" cy="172" r="8" fill="#6fae8f"/>
    <rect x="76" y="160" width="110" height="8" rx="4" fill="#ededed" opacity="0.85"/>
    <rect x="76" y="178" width="96" height="6" rx="3" fill="#a1a1a1" opacity="0.5"/>

    <rect x="0" y="260" width="220" height="84" rx="10" fill="#141414" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="28" cy="302" r="8" fill="#7aa7d9"/>
    <rect x="52" y="290" width="132" height="8" rx="4" fill="#ededed" opacity="0.85"/>
    <rect x="52" y="308" width="72" height="6" rx="3" fill="#a1a1a1" opacity="0.5"/>
  </g>

  <!-- Connection Paths into Central Pipeline -->
  <path d="M 360 212 C 460 212, 480 360, 560 360" stroke="#d97757" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <path d="M 384 342 C 470 342, 490 360, 560 360" stroke="#6fae8f" stroke-width="2" opacity="0.8"/>
  <path d="M 360 472 C 460 472, 480 360, 560 360" stroke="#7aa7d9" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Center: Compiler / Resolution Core -->
  <g transform="translate(560, 260)">
    <rect x="0" y="0" width="200" height="200" rx="24" fill="#1c1c1c" stroke="#d97757" stroke-width="2"/>
    <rect x="20" y="20" width="160" height="160" rx="16" fill="#141414" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <polygon points="100,48 148,100 100,152 52,100" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="14" fill="#d97757"/>
  </g>

  <!-- Output Stream -->
  <path d="M 760 360 L 900 360" stroke="url(#accentGrad)" stroke-width="3"/>
  <circle cx="900" cy="360" r="6" fill="#d97757"/>

  <!-- Right: Unified Module Output -->
  <g transform="translate(900, 220)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#141414" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <rect x="24" y="28" width="90" height="10" rx="5" fill="#d97757"/>
    <rect x="24" y="58" width="192" height="1" fill="rgba(255,255,255,0.09)"/>
    <rect x="24" y="84" width="168" height="10" rx="5" fill="#ededed" opacity="0.8"/>
    <rect x="24" y="114" width="140" height="10" rx="5" fill="#6fae8f" opacity="0.8"/>
    <rect x="24" y="144" width="180" height="10" rx="5" fill="#7aa7d9" opacity="0.8"/>
    <rect x="24" y="174" width="120" height="10" rx="5" fill="#a1a1a1" opacity="0.5"/>
    <rect x="24" y="220" width="192" height="32" rx="8" fill="#1c1c1c" stroke="rgba(217,119,87,0.4)" stroke-width="1"/>
  </g>
</svg>

